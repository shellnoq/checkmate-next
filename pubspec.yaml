name: checkmate_next
description: "CheckMate Next — Stockfish destekli profesyonel satranç uygulaması."
publish_to: 'none'

# versionName+versionCode. Play Store yüklemesinde versionCode her zaman artmalıdır.
version: 1.1.0+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Kural motoru: FIDE kuralları (rok, en passant, terfi, 50 hamle,
  # üç tekrar, yetersiz materyal), FEN/PGN/SAN/UCI desteği.
  dartchess: ^0.13.1

  # Rakip motoru: Stockfish (UCI, FFI üzerinden native).
  stockfish: ^1.8.1

  # Durum yönetimi ve yönlendirme
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Kalıcılık
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0

  # Ses
  just_audio: ^0.9.42

  # Görsel
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/sfx/
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1B1F23"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
